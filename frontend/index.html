    <title>HanVoice — Speak Korean</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "HanVoice",
        "url": "https://hanvoice.app/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web",
        "description": "Trip-prep Korean for travelers: scored pronunciation practice on real trip phrases, AI café/taxi/market conversation rehearsal, Hangul reading and handwriting checks.",
        "offers": [
          {
            "@type": "Offer",
            "name": "Free",
            "price": "0",
            "priceCurrency": "USD"
          },
          {
            "@type": "Offer",
            "name": "Founder Pass (lifetime)",
            "price": "69",
            "priceCurrency": "USD"
          },
          {
            "@type": "Offer",
            "name": "Premium (monthly)",
            "price": "14.99",
            "priceCurrency": "USD"
          }
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What does HanVoice actually teach?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "HanVoice is trip prep, not a fluency course. It has 13 lessons — 8 Hangul reading lessons covering the 21 letters trip phrases need, and 5 Speak lessons of scored trip phrases — plus 5 AI conversation scenarios: café, introductions, restaurant, taxi, and market."
            }
          },
          {
            "@type": "Question",
            "name": "How does the pronunciation scoring work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "You say the phrase out loud and HanVoice scores the recording — overall, accuracy, fluency, and completeness, with a per-word breakdown and one concrete tip on what to fix. A phrase passes at 60 or above."
            }
          },
          {
            "@type": "Question",
            "name": "Is there a free plan?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. The free plan includes 20 scored pronunciation attempts, 10 AI conversation turns, and 10 handwriting checks per day. The Founder Pass is a one-time $69 for lifetime access with higher limits, and there is a 14-day refund policy."
            }
          },
          {
            "@type": "Question",
            "name": "Do I need Korean before a trip to Seoul?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No — English gets you through Seoul. But around ten phrases you can actually say out loud change how every interaction goes. HanVoice exists to get you saying those phrases understandably before you land, and its free Seoul Survival Phrase Card is a one-page start."
            }
          }
        ]
      }
    </script>
  </head>
