# Fly.io config for the HanVoice API.
# London: closest hostable region to Supabase (eu-west-1) and Azure Speech
# (northeurope) — Dublin had no machine capacity at launch time.
app = "hanvoice-api"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  # One machine always warm (~$3/mo): the measured 5.9 s cold start was the
  # first impression on nearly every pre-launch visit (BACKLOG item 4).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# One machine = one uvicorn worker (the in-process rate limiter assumes a
# single process). Scale with more machines, never more workers.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
